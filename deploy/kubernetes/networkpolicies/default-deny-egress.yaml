# Default-deny egress for agent runtime pods.
# Requires a CNI that enforces NetworkPolicy. Explicitly allow DNS and the
# controlled egress gateway. Direct internet egress stays blocked.
# 智能体运行时 Pod 默认拒绝出站流量。需要支持 NetworkPolicy 的 CNI。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: agent-runtime
spec:
  podSelector: {}
  policyTypes: [Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-and-egress-gateway
  namespace: agent-runtime
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agent-runtime
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: egress-gateway
      ports:
        - protocol: TCP
          port: 3128
