# Restricted agent workload: no API token mounted, no privileges.
# 受限的 Agent 工作负载：不挂载 API Token，不授予特权。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: restricted-agent
  namespace: agent-runtime
automountServiceAccountToken: false
---
apiVersion: v1
kind: Pod
metadata:
  name: agent-runtime-example
  namespace: agent-runtime
  labels:
    app.kubernetes.io/name: agent-runtime
spec:
  serviceAccountName: restricted-agent
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: agent
      image: example.invalid/agent-runtime:0.2.0
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        readOnlyRootFilesystem: true
