[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcomply"
version = "0.2.0"
description = "Developer-first runtime authorization SDK for AI agent tool calls. / 面向 AI Agent 工具调用的开发者优先运行时授权 SDK。"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["PyYAML>=6.0", "jsonschema>=4.18"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Natural Language :: English",
    "Natural Language :: Chinese (Simplified)",
    "License :: OSI Approved :: Apache Software License",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agentcomply = "agentcomply.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentcomply = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
